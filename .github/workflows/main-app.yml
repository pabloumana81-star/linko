name: Main app

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: ./scripts/audit_repository.sh
      - name: Compile web without production credentials
        run: flutter build web --release --dart-define=BACKEND_MODE=mock
