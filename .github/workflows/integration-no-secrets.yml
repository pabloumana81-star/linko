name: Secret-free integration

on:
  push:
  pull_request:

jobs:
  main-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/web_beta_smoke_test.dart --platform chrome --dart-define=BACKEND_MODE=mock

  cross-app-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/shared_supabase_synchronization_test.dart

  admin-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/admin_browser_flow_test.dart --platform chrome --dart-define=BACKEND_MODE=mock
